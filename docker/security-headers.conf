# A bare list of `add_header` directives, meant to be included. This file exists
# only to work around the `add_header` inheritance footgun documented in
# docker/nginx.conf: a nested `location` that declares its own `add_header`
# discards the server-level list wholesale rather than adding to it. Keeping the
# headers here means there is exactly one copy to audit, and the rule for
# maintainers is short: any location that adds a header of its own MUST include
# this file again.
#
# Nothing else belongs in here -- no `server`, no `location`, no `if` -- because
# this text gets spliced into all of them.

# Clause by clause, since a long CSP is not the same thing as an understood one:
#
#   default-src 'none'    Denies every fetch type not named below. The named
#                         ones are the complete set this app needs.
#   script-src 'self'     Safe without a nonce or a hash because the built
#                         index.html has no inline script at all: the module is
#                         an external file under /assets/. There is nothing
#                         inline to bless, so 'unsafe-inline' is unnecessary.
#   style-src 'self'
#     'unsafe-inline'     The one concession, and it is deliberate. index.html
#                         ships a single inline <style> whose only job is to
#                         paint the dark background before the external
#                         stylesheet arrives, which is what removes the white
#                         flash. A static file cannot carry a per-request nonce,
#                         so inline style is the only way to keep that. It is
#                         scoped to styles, so it grants nothing to script.
#   img-src 'self' blob:
#     data:               Previews are local files handed to
#                         URL.createObjectURL, which yields blob: URLs, and
#                         data: covers anything inlined directly.
#   font-src 'self'       No webfonts and no font CDN; the UI uses the system
#                         font stack, so anything else would be a bug.
#   connect-src 'none'    The load-bearing clause. fetch, XHR, WebSocket,
#                         sendBeacon and EventSource are all refused, so "运行期
#                         不发出任何网络请求" stops being a documentation
#                         promise and becomes something the browser enforces. If
#                         this ever has to be relaxed, that is the signal that
#                         the product's central claim has changed.
#   form-action 'none'    There are no form submissions to allow.
#   base-uri 'none'       An injected <base> could re-point every relative URL
#                         in the document, including the asset references.
#   frame-ancestors       The page cannot be framed, so no UI can be embedded
#     'none'              elsewhere for clickjacking or for repackaging.
#   object-src 'none'     No <object>/<embed>; also a legacy XSS vector.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

# Stops a user agent from re-sniffing a response away from the Content-Type
# nginx sent, which is how a text/plain-served script becomes executable.
add_header X-Content-Type-Options "nosniff" always;

# The whole document is self-contained, so a Referer would tell a third party
# nothing useful about this app while still leaking the user's current URL.
# no-referrer also covers the case where someone links here from a page whose
# path they would rather not disclose.
add_header Referrer-Policy "no-referrer" always;

# Redundant next to frame-ancestors 'none', and kept on purpose: user agents
# that predate CSP level 2 -- old embedded webviews in particular -- understand
# only this one.
add_header X-Frame-Options "DENY" always;
