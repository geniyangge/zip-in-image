# One `server` block and nothing else: this file is a `conf.d/*.conf` drop-in,
# and the stock image's main nginx.conf already supplies the events/http context
# and includes this directory.
#
# The single nginx footgun that shapes this whole file: `add_header` does not
# merge across levels. As soon as a nested `location` declares one `add_header`,
# that block's list *replaces* every `add_header` inherited from the server
# level -- it is a replacement, not a union, and nginx does not warn. So the
# security headers live in their own snippet file, and every location that sets a
# header of its own re-includes that snippet. Drop the include from one location
# and that location silently stops sending CSP, nosniff, and the rest.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No `types { }` block here on purpose. The stock image maps extensions
    # through mime.types at the http level, and a `types` block inside `server`
    # would replace that inherited map wholesale rather than extend it -- so a
    # hand-written list that happens to cover .js and .css would still break
    # every other extension the build emits. `application/javascript` and
    # `text/javascript` are both valid essence matches for a `type="module"`
    # script, so the inherited default is already correct. Leave it alone.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # nginx's default gzip_types is text/html only. The two files that actually
    # carry this app -- an external stylesheet and an external ES module -- are
    # not text/html, so without this list they would ship uncompressed.
    gzip_types text/plain
               text/css
               text/javascript
               application/javascript
               application/json
               image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Backs the compose healthcheck, which runs busybox wget from inside the
    # container and needs a body it can read as a success.
    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    # A cached index.html is worse than no cache at all: the asset URLs it
    # references carry content hashes, so a returning client can be holding
    # references to bundles the next deploy already deleted. no-cache still
    # allows a 304 when nothing changed and forces a fresh copy when it did.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite fingerprints these filenames from their contents, so a byte-level
    # change is a new filename and a one-year immutable cache cannot go stale.
    # The `add_header` form is required for the `immutable` directive, which
    # `expires` cannot express -- and that is precisely why this block has to
    # re-include the security headers instead of inheriting them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The app is tab-based and has no router, so a path that is not a real file
    # IS a 404. Falling back to /index.html here would be actively wrong: a
    # request for a JS chunk that the next deploy deleted would come back as
    # HTML with a 200, and the browser would report a MIME type error instead of
    # a clean "not found". `/` itself is served by the `index` directive above.
    # If a router is ever added, this becomes `try_files $uri $uri/ /index.html`.
    location / {
        try_files $uri $uri/ =404;
    }
}
